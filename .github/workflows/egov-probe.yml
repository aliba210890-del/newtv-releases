# Разведка наборов данных на data.egov.kz
name: Egov probe
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    env: { K: "${{ secrets.EGOV_KEY }}", GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - run: python3 jolda-map/egov_probe.py
      - run: gh release upload media out.txt -R ${{ github.repository }} --clobber
