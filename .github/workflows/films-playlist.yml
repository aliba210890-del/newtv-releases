# Обновляет playlists/films.m3u: берёт свежий FILMS.m3u у Dimonovich
# и убирает рекламные заставки автора. Запускается каждые 3 часа.
# Ссылка для плеера:
#   https://raw.githubusercontent.com/aliba210890-del/newtv-releases/main/playlists/films.m3u
name: Films playlist

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Скачать и почистить
        run: |
          curl -fsSL --retry 3 -o /tmp/src.m3u \
            "https://raw.githubusercontent.com/Dimonovich/TV/refs/heads/Dimonovich/FREE/FILMS.m3u"
          python3 playlists/clean_films.py /tmp/src.m3u playlists/films.m3u

      - name: Сохранить, если изменился
        run: |
          git config user.name "newtv-bot"
          git config user.email "newtv-bot@users.noreply.github.com"
          git add playlists/films.m3u
          git diff --cached --quiet || (git commit -m "Обновить плейлист фильмов" && git push)
