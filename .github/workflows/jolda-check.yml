# Быстрая проверка живого сервера Jolda (без входа и без секретов): какие функции сейчас на сервере
name: Jolda check
on:
  push:
    branches: [main]
    paths: [".github/workflows/jolda-check.yml", "jolda-deploy/check.trigger"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Проверить сайт
        run: |
          B=https://jolda.aliba210890.workers.dev
          {
            echo "time: $(date -u)"
            echo "build: $(curl -s "$B/api/config?x=$RANDOM" | grep -o '"build":"[^"]*"')"
            q() { local t0=$(date +%s%N); local r=$(curl -s -m 40 -G "$B/api/places" --data-urlencode "q=$1" -d lat=$2 -d lng=$3 | head -c 260); echo "[$1 @ $2,$3] $(( ($(date +%s%N)-t0)/1000000 ))ms: $r"; }
            q "Ерубаева 50" 49.80 73.10
            q "Сити Молл" 49.80 73.10
            q "Тауке хана 100" 42.32 69.59
            q "Абая 10" 51.668 71.037
            q "Караганда" 51.07 71.75
            q "Шымкент" 51.07 71.75
            q "Бауырым" 51.075 71.75
            q "Ерубаева 50" 49.80 73.10
            q "Достык 5" 47.10 51.92
            echo "revgeo-krg: $(curl -s -m 40 "$B/api/revgeo?lat=49.8047&lng=73.1094" | head -c 200)"
            echo "tiles-head: $(curl -s -m 40 -r 0-126 "$B/map/astana.pmtiles" | head -c 7) $(curl -s -m 40 -r 0-126 "$B/map/astana.pmtiles" | od -An -tu1 -j100 -N2)"
            echo "partners-index: $(curl -s "$B/partners?x=$RANDOM" | grep -c noindex) $(curl -s "$B/robots.txt" | grep -c partners) $(curl -s "$B/sitemap.xml" | grep -c partners)"
          } > jolda-check.txt
          cat jolda-check.txt
          gh release upload map jolda-check.txt -R "$R" --clobber
