name: Jolda contacts
on: [workflow_dispatch]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST https://joldataxi.kz/api/quote -H 'content-type: application/json' -d '{"from":{"lat":51.1580,"lng":71.4100},"to":{"lat":51.1323,"lng":71.4040}}' | python3 -c "import sys,json;j=json.load(sys.stdin);print('::notice::'+json.dumps([o for o in j.get('options',[]) if o.get('cls') in ('together','econom')],ensure_ascii=False))"
          curl -s https://joldataxi.kz/ | grep -c 'С попутчиком' || true
