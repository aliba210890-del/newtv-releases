name: Jolda D1 check
on: [workflow_dispatch]
jobs:
  d1:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          T=$(printf %s "$CF_API_TOKEN" | tr -d '[:space:]"'"'"'' | sed 's/^Bearer//I'); if [ ${#T} -gt 80 ]; then T=$(printf %s "$T" | grep -oE '[A-Za-z0-9_-]{35,60}' | head -1); fi
          A=$(printf %s "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          H="Authorization: Bearer $T"; U=https://api.cloudflare.com/client/v4/accounts/$A
          curl -s "$U/d1/database" -H "$H" > dbs.json
          python3 -c "import json;d=json.load(open('dbs.json'));print('::notice::dbs',d.get('success'),json.dumps(d.get('errors'))[:200],[(x['name'],x['uuid'],x.get('file_size'),x.get('num_tables')) for x in d.get('result') or []])"
          ID=$(python3 -c "import json;r=json.load(open('dbs.json')).get('result') or [];print(r[0]['uuid'] if r else '')")
          for q in "SELECT 1 AS ok" "SELECT COUNT(*) n FROM orders" "SELECT COUNT(*) n FROM sqlite_master"; do
            echo "::notice::$q => $(curl -s -X POST "$U/d1/database/$ID/query" -H "$H" -H 'content-type: application/json' -d "{\"sql\":\"$q\"}" | head -c 400)"
          done
          echo "::notice::site $(curl -s https://joldataxi.kz/api/config | head -c 200)"
          echo "::notice::diag $(curl -s https://joldataxi.kz/diag-db | head -c 900)"
