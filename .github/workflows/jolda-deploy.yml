# Выкладка сервера Jolda в Cloudflare без ручного копирования.
# Код лежит здесь только в зашифрованном виде (jolda-deploy/worker.js.enc), ключ — в секретах GitHub.
# Обновляется только код воркера: базы, привязки и секреты в Cloudflare не трогаются.
name: Jolda deploy

on:
  push:
    branches: [main]
    paths: ["jolda-deploy/worker.js.enc"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Расшифровать код
        env:
          JOLDA_KEY: ${{ secrets.JOLDA_KEY }}
        run: |
          [ -n "${{ secrets.CF_API_TOKEN }}" ] || echo "::error::Нет секрета CF_API_TOKEN"
          [ -n "${{ secrets.CF_ACCOUNT_ID }}" ] || echo "::error::Нет секрета CF_ACCOUNT_ID"
          test -n "$JOLDA_KEY" || { echo "::error::Нет секрета JOLDA_KEY"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:JOLDA_KEY -in jolda-deploy/worker.js.enc -out worker.js || { echo "::error::JOLDA_KEY неверный"; exit 1; }
          ls -la worker.js
      - name: Обновить код воркера jolda
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          CF_API_TOKEN=$(printf %s "$CF_API_TOKEN" | tr -d '[:space:]"'"'"'' | sed 's/^Bearer//I')
          CF_ACCOUNT_ID=$(printf %s "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          if [ ${#CF_API_TOKEN} -gt 80 ]; then
            # в секрет попал лишний текст (например, вся команда проверки) — достаём сам токен
            T=$(printf %s "$CF_API_TOKEN" | grep -oiE 'bearer[^A-Za-z0-9_-]*[A-Za-z0-9_-]{30,}' | head -1 | sed -E 's/^bearer[^A-Za-z0-9_-]*//I')
            [ -n "$T" ] || T=$(printf %s "$CF_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{35,60}' | head -1)
            echo "::notice::в секрете лишний текст (${#CF_API_TOKEN} символов), найден токен длиной ${#T}"
            CF_API_TOKEN="$T"
          fi
          echo "::notice::token length ${#CF_API_TOKEN}"
          test -n "$CF_API_TOKEN" || echo "::error::Нет секрета CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID" || echo "::error::Нет секрета CF_ACCOUNT_ID"
          test -n "$CF_API_TOKEN" && test -n "$CF_ACCOUNT_ID" || exit 1
          echo "::notice::token verify: $(curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CF_API_TOKEN" | head -c 300)"
          echo "::notice::account id length ${#CF_ACCOUNT_ID}"
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/jolda/content" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@worker.js;type=application/javascript+module" > out.json
          python3 -c "import json;d=json.load(open('out.json'));print('::notice::success:',d.get('success'),json.dumps(d.get('errors'))[:400])"
          python3 -c "import json,sys;sys.exit(0 if json.load(open('out.json')).get('success') else 1)"
      - name: Проверить сайт
        run: |
          sleep 5
          curl -s -o /dev/null -w "partners %{http_code}\n" "https://jolda.aliba210890.workers.dev/partners?x=$RANDOM"
