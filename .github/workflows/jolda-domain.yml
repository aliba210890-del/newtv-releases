name: Jolda domain check
on: [workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y whois >/dev/null 2>&1
          for d in jolda.kz joldataxi.kz jolda-taxi.kz joldago.kz jolda.app; do
            w=$(whois $d 2>&1 | grep -iE "not found|no entries|nothing found|available|Domain name|Registrar|Created|Name Server" | head -4 | tr '\n' ' | ')
            ns=$(dig +short NS $d | tr '\n' ' ')
            echo "::notice::$d => NS:[$ns] WHOIS:[$w]"
          done
          for u in https://joldataxi.kz/ https://www.joldataxi.kz/ https://joldataxi.kz/partners https://joldataxi.kz/favicon.ico; do
            echo "::notice::$u => $(curl -s -o /tmp/b -w '%{http_code}' -m 20 $u) $(head -c 120 /tmp/b | tr -d '\n' | grep -o '<title>[^<]*' )"
          done
