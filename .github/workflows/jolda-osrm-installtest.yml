# Проверка установщика сервера маршрутов Jolda на чистой Ubuntu (раннер GitHub)
name: Jolda OSRM install test
on:
  workflow_dispatch: {}
  push: { paths: ['.github/workflows/jolda-osrm-installtest.yml', 'jolda-osrm/**'] }
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: wait for graph release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: for i in $(seq 1 40); do gh release view jolda-osrm-graph -R ${{ github.repository }} --json assets -q '.assets[].name' 2>/dev/null | grep -q kz-osrm && break; sleep 30; done
      - name: install
        run: set -o pipefail; sudo bash jolda-osrm/install.sh test.invalid 2>&1 | tail -15
      - name: routes
        run: |
          free -m
          set -e; for q in "71.43,51.13;71.76,51.07" "71.75,51.07;71.74,51.08" "71.40,51.16;71.46,51.10"; do curl -s "http://127.0.0.1:5000/route/v1/driving/$q?overview=false" | jq -c '{code, d:.routes[0].distance, t:.routes[0].duration}'; done
          sudo crontab -l
# rerun 1795495657
# rerun2
# rerun3
      - name: upgrade (key) + update without pause
        run: |
          set -o pipefail
          K=testkey_0123456789abcdefghij
          sudo sed -i 's#^HOST=.*#HOST=http://test.invalid#' /opt/osrm/.env   # в тесте без сертификата: тот же Caddyfile, но по http
          sudo R="file://$PWD/jolda-osrm" bash jolda-osrm/upgrade.sh $K 2>&1 | tail -5 || true
          sleep 5
          U="http://test.invalid/route/v1/driving/71.43,51.13;71.76,51.07?overview=false"
          A=$(curl -sk --resolve test.invalid:80:127.0.0.1 -o /dev/null -w '%{http_code}' -H "X-Jolda-Key: $K" "$U"); B=$(curl -sk --resolve test.invalid:80:127.0.0.1 -o /dev/null -w '%{http_code}' "$U")
          echo "with key: $A, without: $B"; [ "$A" = 200 ] && [ "$B" = 403 ]
          ( ok=0; bad=0; while [ ! -f /tmp/upd.done ]; do c=$(curl -sk --max-time 10 --resolve test.invalid:80:127.0.0.1 -o /dev/null -w '%{http_code}' -H "X-Jolda-Key: $K" "$U"); [ "$c" = 200 ] && ok=$((ok+1)) || bad=$((bad+1)); sleep 0.3; done; echo "during update: ok=$ok bad=$bad" > /tmp/upd.res ) &
          sudo R="file://$PWD/jolda-osrm" bash /opt/osrm/update.sh 2>&1 | tail -5
          touch /tmp/upd.done; sleep 2; cat /tmp/upd.res; grep -q 'bad=0' /tmp/upd.res
