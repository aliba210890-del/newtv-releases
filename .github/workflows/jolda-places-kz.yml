# База мест «Жолда» на весь Казахстан: OpenStreetMap + Overture + Foursquare + Wikidata,
# нарезанная на куски по регионам (kz_<широта>_<долгота>.json.gz) в релизе «map-kz».
# Сервер берёт кусок рядом с клиентом; Астана и 100 км вокруг — как раньше, из astana-places.json.gz.
name: Jolda places KZ

on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * 0"   # каждое воскресенье ночью, после базы Астаны
  push:
    branches: [main]
    paths: ["jolda-map/split_kz.py", ".github/workflows/jolda-places-kz.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      JOLDA_EXPORT: kz.geojsonseq
      JOLDA_BBOX: "46.40,40.50,87.40,55.50"
    steps:
      - uses: actions/checkout@v4
      - name: Карта Казахстана (OpenStreetMap, Geofabrik)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL --retry 5 -o kz.pbf https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf
          osmium tags-filter kz.pbf nwr/name nwr/addr:housenumber n/entrance nwr/landuse=cemetery,allotments nwr/amenity=grave_yard nwr/leisure=resort,beach_resort nwr/tourism=camp_site -o f.pbf --overwrite
          osmium export f.pbf -f geojsonseq -o kz.geojsonseq --overwrite
          wc -l kz.geojsonseq; ls -la kz.pbf kz.geojsonseq
      - name: Открытые базы организаций
        continue-on-error: true
        timeout-minutes: 60
        run: |
          pip install -q duckdb overturemaps
          python3 -u jolda-map/fetch_extra.py 2>&1 | tee extra-fetch-kz.log
          ls -la *.ndjson || true
      - name: Собрать базу Казахстана
        run: |
          /usr/bin/time -v python3 -u jolda-map/build_places.py - kz-places.json.gz 2>&1 | tee places-build-kz.log; test ${PIPESTATUS[0]} -eq 0
          ls -la kz-places.json.gz
      - name: Нарезать по регионам
        run: python3 -u jolda-map/split_kz.py kz-places.json.gz kz 2>&1 | tee -a places-build-kz.log; ls kz | wc -l; du -sh kz
      - name: Загрузить в релиз map-kz
        run: |
          gh release view map-kz -R "$R" >/dev/null 2>&1 || gh release create map-kz -R "$R" -t "Jolda: база мест Казахстана" -n "Куски базы мест по регионам. Обновляется автоматически."
          gh release upload map-kz kz/* places-build-kz.log -R "$R" --clobber
          gh release upload map-kz extra-fetch-kz.log -R "$R" --clobber || true
