# База мест «Жолда»: раз в неделю берёт свежие ЖК, кафе, магазины и адреса Астаны из OpenStreetMap
# и обновляет файл astana-places.json.gz в релизе «map» (его читает сервер Жолда).
name: Jolda places

on:
  schedule:
    - cron: "17 21 * * 0"   # каждое воскресенье ночью по Астане
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["jolda-map/**", ".github/workflows/jolda-places.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Скачать текущую базу
        run: gh release download map -R "$R" -p astana-places.json.gz -O old.json.gz
      - name: Скачать карту Казахстана (OpenStreetMap, Geofabrik)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL --retry 5 -o kz.pbf https://download.geofabrik.de/asia/kazakhstan-latest.osm.pbf
          ls -la kz.pbf
      - name: Вырезать Астану и 100 км вокруг
        run: |
          osmium extract -b 70.00,50.20,72.90,52.05 kz.pbf -o astana.pbf --overwrite
          osmium tags-filter astana.pbf nwr/name nwr/addr:housenumber -o f.pbf --overwrite
          osmium export f.pbf -f geojsonseq -o astana.geojsonseq --overwrite
          wc -l astana.geojsonseq
      - name: Скачать открытые базы организаций (Overture Maps, Foursquare)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pip install -q duckdb overturemaps
          python3 -u jolda-map/fetch_extra.py 2>&1 | tee extra-fetch.log
          ls -la *.ndjson || true
          for f in overture fsq; do [ -s $f.ndjson ] && gzip -kf $f.ndjson && gh release upload map $f.ndjson.gz -R "$R" --clobber || true; done
          gh release upload map extra-fetch.log -R "$R" --clobber || true
      - name: Собрать новую базу
        run: python3 -u jolda-map/build_places.py old.json.gz astana-places.json.gz 2>&1 | tee places-build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Обновить файл в релизе
        run: gh release upload map astana-places.json.gz -R "$R" --clobber
      - name: Журнал сборки
        if: always()
        run: gh release upload map places-build.log -R "$R" --clobber || true
