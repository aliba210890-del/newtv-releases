# База мест «Жолда»: раз в неделю берёт свежие ЖК, кафе, магазины и адреса Астаны из OpenStreetMap
# и обновляет файл astana-places.json.gz в релизе «map» (его читает сервер Жолда).
name: Jolda places

on:
  schedule:
    - cron: "17 21 * * 0"   # каждое воскресенье ночью по Астане
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["jolda-map/**", ".github/workflows/jolda-places.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Скачать текущую базу
        run: gh release download map -R "$R" -p astana-places.json.gz -O old.json.gz
      - name: Собрать новую базу
        run: python3 jolda-map/build_places.py old.json.gz astana-places.json.gz
      - name: Обновить файл в релизе
        run: gh release upload map astana-places.json.gz -R "$R" --clobber
