name: Jolda probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://joldataxi.kz
          for q in "Хайвил" "Highvill" "Гранд Опера" "Grand Opera" "Нурсая" "Северное сияние" "Европа палас" "Изумрудный квартал" "Хан Шатыр" "ЖК Шахристан" "Тумар" "Миллениум парк" "Атамекен" "Дипломат" "Престиж"; do
            r=$(curl -s -G "$B/api/places" --data-urlencode "q=$q" --data-urlencode lat=51.13 --data-urlencode lng=71.43 | python3 -c "import sys,json;j=json.load(sys.stdin);print(len(j.get('items',[])), '|', '; '.join((x.get('name','')+' ['+str(x.get('sub',''))+']') for x in j.get('items',[])[:3]))")
            echo "::notice::$q => $r"
          done
