name: Jolda probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 15
          q() { echo "=== $1: $(curl -s -X POST https://joldataxi.kz/api/quote -H 'content-type: application/json' -d "$2" | jq -c '[.options[]? | select(.cls=="econom") | .price]')"; }
          q "Алтынсарина 10 → 6 мкр" '{"from":{"lat":51.0745,"lng":71.7659,"addr":"улица Ибрая Алтынсарина, 10, пос. Жибек Жолы"},"to":{"lat":51.0892,"lng":71.7084,"addr":"6 мкр"}}'
          q "3 массив → 6 мкр" '{"from":{"lat":51.073,"lng":71.788,"addr":"3 массив"},"to":{"lat":51.0892,"lng":71.7084,"addr":"6 мкр"}}'
          q "2 мкр → 6 мкр" '{"from":{"lat":51.071,"lng":71.7649,"addr":"2 мкр"},"to":{"lat":51.0892,"lng":71.7084,"addr":"6 мкр"}}'
