name: Jolda probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          LL="lat=51.07&lng=71.76"
          while IFS= read -r q; do
            case "$q" in @*) c=${q#@}; c=${c%% *}; LL="lat=${c%,*}&lng=${c#*,}"; echo "=== ### $q"; continue;; esac
            echo "=== $q"; curl -s -G </dev/null "https://joldataxi.kz/api/places" --data-urlencode "q=$q" --data "$LL" | jq -r '.items[]? | "  \(.name) | \(.sub)"' | head -4 || true
          done < jolda-probe-q.txt
