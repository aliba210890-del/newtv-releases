name: Jolda probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 15
          q() { echo "=== $1: $(curl -s -X POST https://joldataxi.kz/api/quote -H 'content-type: application/json' -d "$2" | jq -c '[.options[]? | select(.cls=="econom") | .price]')"; }
          for u in app drv d/22263b6f3cd26397e8b1f4f7/c apk/driver; do echo "=== /$u: $(curl -s -o /dev/null -w "%{http_code} %{redirect_url} %{size_download}" https://joldataxi.kz/$u)"; done
