name: Jolda probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 15
          echo "=== $(curl -s https://joldataxi.kz/ | grep -o 'jmx1w[a-z0-9]*' | head -1) drv:$(curl -s https://joldataxi.kz/drv | sha256sum | cut -c1-16) app:$(curl -s -o /dev/null -w '%{http_code}' https://joldataxi.kz/app)"
