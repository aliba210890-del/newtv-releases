name: Jolda probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 20
          echo "=== $(curl -s https://joldataxi.kz/ | grep -o 'jmx1w[a-z0-9]*' | head -1) sw:$(curl -s https://joldataxi.kz/driver | grep -c 'sw.js')"
          echo "=== $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://joldataxi.kz/sw.js)"
          echo "=== $(curl -s -o /dev/null -w '%{http_code}' https://joldataxi.kz/api/config)"
