name: Jolda probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://joldataxi.kz
          echo "::notice::revgeo $(curl -s "$B/api/revgeo?lat=51.14002&lng=71.36888")"
          echo "::notice::khan $(curl -s "$B/api/places?q=%D0%A5%D0%B0%D0%BD%20%D0%A8%D0%B0%D1%82%D1%8B%D1%80&lat=51.15&lng=71.40" | head -c 220)"
          echo "::notice::turan $(curl -s "$B/api/places?q=%D1%82%D1%83%D1%80%D0%B0%D0%BD%2037&lat=51.15&lng=71.40" | head -c 160)"
          echo "::notice::client new text $(curl -s $B/ | grep -c 'Машина уже рядом')"
          curl -sL https://github.com/aliba210890-del/newtv-releases/releases/download/map/astana-places.json.gz | gunzip | python3 -c "import sys,json;j=json.load(sys.stdin);s=j.get('sru',{});print('::notice::sru',len(s),'addr',sum(1 for a in j['addr'] if a[0] in s),'/',len(j['addr']),list(s.items())[:6])"
