name: Jolda probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 15
          q() { echo "=== $1: $(curl -s -X POST https://joldataxi.kz/api/quote -H 'content-type: application/json' -d "$2" | jq -c '[.options[]? | select(.cls=="econom") | .price]')"; }
          sleep 20; echo "=== support: $(curl -s https://joldataxi.kz/api/config | jq -c '{support, phones}')"
          echo "=== img: $(curl -s -o /dev/null -w '%{http_code} %{size_download}' 'https://joldataxi.kz/img/c-done.webp?v=2')"
