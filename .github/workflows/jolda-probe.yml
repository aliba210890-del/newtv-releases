name: Jolda probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 15
          q() { echo "=== $1: $(curl -s -X POST https://joldataxi.kz/api/quote -H 'content-type: application/json' -d "$2" | jq -c '[.options[]? | select(.cls=="econom") | .price]')"; }
          q "Сары Арка 120 → 6 мкр (ждём 750)" '{"from":{"lat":51.0745,"lng":71.7659,"addr":"улица Сары Арка, 120, пос. Жибек Жолы"},"to":{"lat":51.0892,"lng":71.7084,"addr":"6 мкр"}}'
          q "Тастөбе 2 → 4 мкр (ждём 1450)" '{"from":{"lat":51.0745,"lng":71.7659,"addr":"улица Тастөбе, 2, пос. Жибек Жолы"},"to":{"lat":51.0475,"lng":71.7917,"addr":"4 мкр"}}'
          q "Нура 5 → 3 массив (ждём 1050)" '{"from":{"lat":51.0745,"lng":71.7659,"addr":"улица Нура, 5, пос. Жибек Жолы"},"to":{"lat":51.073,"lng":71.788,"addr":"3 массив"}}'
          q "Нұрлы таң 3 → 4 мкр (ждём 1450)" '{"from":{"lat":51.0745,"lng":71.7659,"addr":"улица Нұрлы таң, 3, пос. Жибек Жолы"},"to":{"lat":51.0475,"lng":71.7917,"addr":"4 мкр"}}'
          q "Алтынсарина 10 → 6 мкр (ждём 1250)" '{"from":{"lat":51.0745,"lng":71.7659,"addr":"улица Ибрая Алтынсарина, 10, пос. Жибек Жолы"},"to":{"lat":51.0892,"lng":71.7084,"addr":"6 мкр"}}'
          echo "=== build: $(curl -s https://joldataxi.kz/api/health | head -c 200)"
