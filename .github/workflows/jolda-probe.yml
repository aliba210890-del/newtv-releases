name: Jolda probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://joldataxi.kz
          echo "::notice::driver ver $(curl -s $B/driver | grep -o '"ru":{"v":"[a-z0-9]*"')"
          curl -s -o g.mp3 "$B/voice/ru_greet_start.mp3?v=zholdaa2"; echo "::notice::greet $(md5sum g.mp3 | cut -c1-10) $(stat -c %s g.mp3)"
          curl -s -o b.mp3 "$B/voice/ru_bye_day.mp3?v=zholdaa2"; echo "::notice::bye $(md5sum b.mp3 | cut -c1-10) $(stat -c %s b.mp3)"
