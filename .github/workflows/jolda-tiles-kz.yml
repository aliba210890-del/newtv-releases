# Карта «Жолда» на весь Казахстан: вырезаем Казахстан из свежей карты мира Protomaps (OpenStreetMap).
# Режем строго по границе страны (без соседних Омска, Ташкента, Бишкека) — так весь Казахстан влезает до 15 зума.
# Результат kz.pmtiles в релизе «map»; сервер отдаёт его по адресу /map/astana.pmtiles.
name: Jolda tiles KZ

on:
  workflow_dispatch:
  schedule:
    - cron: "40 20 1 * *"   # раз в месяц
  push:
    branches: [main]
    paths: [".github/workflows/jolda-tiles-kz.yml"]

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Программа pmtiles
        run: |
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64.tar.gz' -O pm.tgz
          tar xzf pm.tgz pmtiles && sudo mv pmtiles /usr/local/bin/ && pmtiles version || true
      - name: Последняя карта мира
        run: |
          K=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | python3 -c "import json,sys; b=json.load(sys.stdin); print(sorted(x['key'] for x in b)[-1])")
          echo "build: $K"; echo "SRC=https://build.protomaps.com/$K" >> $GITHUB_ENV
      - name: Граница Казахстана (Geofabrik)
        run: |
          curl -fsSL -o kz.poly https://download.geofabrik.de/asia/kazakhstan.poly
          python3 - <<'PY'
          import json
          rings, cur = [], None
          for ln in open("kz.poly"):
              t = ln.strip()
              if not t: continue
              if t == "END":
                  if cur is not None: rings.append(cur); cur = None
                  continue
              p = t.split()
              if len(p) == 2:
                  try: cur.append([float(p[0]), float(p[1])]); continue
                  except Exception: pass
              if cur is None and t != "kazakhstan": cur = []
          polys = [[r + [r[0]]] for r in rings if len(r) > 3]
          json.dump({"type": "MultiPolygon", "coordinates": polys}, open("kz.geojson", "w"))
          print("колец:", len(polys))
          PY
      - name: Вырезать весь Казахстан до 15 зума (по границе страны)
        run: |
          pmtiles extract "$SRC" kz15full.pmtiles --region=kz.geojson --maxzoom=15 --download-threads=8
          ls -la kz15full.pmtiles
      - name: Выбрать файл
        run: |
          S=$(stat -c %s kz15full.pmtiles)
          if [ $S -lt 2100000000 ]; then
            echo "весь Казахстан до 15 зума помещается: $S"; mv kz15full.pmtiles kz.pmtiles
          else
            echo "до 15 зума не помещается ($S) — Казахстан до 14 по границе"; rm -f kz15full.pmtiles
            pmtiles extract "$SRC" kz.pmtiles --region=kz.geojson --maxzoom=14 --download-threads=8
          fi
          pmtiles show kz.pmtiles | head -12; ls -la kz.pmtiles
      - name: Загрузить в релиз
        run: gh release upload map kz.pmtiles -R "$R" --clobber
