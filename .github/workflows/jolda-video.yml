# Разбор видео тестовой поездки: кадры зашифрованы ключом JOLDA_KEY, хранятся 1 день как артефакт (не в открытом релизе)
name: Jolda video frames
on:
  workflow_dispatch:
    inputs:
      id: { description: "Google Drive file id", required: true }
      name: { description: "label", required: true }
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: |
          curl -sSL -o v.mp4 "https://drive.usercontent.google.com/download?id=${{ inputs.id }}&export=download&confirm=t" || echo "::error::curl failed"
          echo "::notice::size $(stat -c %s v.mp4) type $(file -b v.mp4 | cut -c1-80)"
          if ! file v.mp4 | grep -qi "media\|mp4\|iso"; then echo "::error::not video: $(head -c 300 v.mp4 | tr -d '\n')"; exit 1; fi
          sudo apt-get install -y -qq ffmpeg >/dev/null
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 v.mp4); echo "dur $D"
          mkdir f; ffmpeg -loglevel error -i v.mp4 -vf "fps=1/2,scale=480:-2" -q:v 6 f/%04d.jpg
          ffmpeg -loglevel error -i v.mp4 -vn -ac 1 -ar 16000 -b:a 24k f/audio.mp3 || true
          echo "$D" > f/duration.txt; ls f | wc -l
          tar czf f.tgz f && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in f.tgz -out f.enc && ls -la f.enc
        env: { K: "${{ secrets.JOLDA_KEY }}" }
      - name: Зашифрованный файл в релиз map (открыть можно только ключом)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: cp f.enc "vid-${{ inputs.name }}.enc" && gh release upload map "vid-${{ inputs.name }}.enc" -R ${{ github.repository }} --clobber
