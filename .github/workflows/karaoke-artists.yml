# Караоке: черновик каталога по исполнителям (playlists/karaoke_draft.json). В приложение не попадает, пока не утвердим.
name: Караоке — каталог по исполнителям
on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Собрать
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 playlists/karaoke_artists.py playlists/karaoke_draft.json playlists/karaoke_draft_report.txt
      - name: Сохранить
        run: |
          git config user.name "newtv-bot"; git config user.email "bot@newtvglobal.online"
          git add playlists/karaoke_draft.json playlists/karaoke_draft_report.txt
          git commit -qm "Караоке: черновик по исполнителям" || exit 0
          git pull -q --rebase && git push -q
