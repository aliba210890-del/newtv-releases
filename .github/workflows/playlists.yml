# Обновляет плейлисты в playlists/: берёт свежие файлы у Dimonovich
# и убирает рекламные заставки автора, фильмы раскладывает по жанрам. Запускается каждые 3 часа.
# Открытых плейлистов здесь нет: в репозиторий кладутся только зашифрованные playlists/films.enc и tv.enc.
# Расшифровывает и отдаёт их сервер New TV по секретной ссылке (см. админку → «Плейлисты New TV»).
name: Playlists

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Скачать и почистить
        run: |
          SRC="https://raw.githubusercontent.com/Dimonovich/TV/refs/heads/Dimonovich/FREE"
          curl -fsSL --retry 3 -o /tmp/films.m3u "$SRC/FILMS.m3u"
          curl -fsSL --retry 3 -o /tmp/tv.m3u "$SRC/TV"
          python3 playlists/clean_playlist.py /tmp/films.m3u /tmp/films_clean.m3u
          # разложить фильмы по жанрам, мультфильмы по годам (жанры ищутся в Wikidata, найденное хранится в film_genres.json)
          mkdir -p /tmp/out
          # описания фильмов из русской Википедии (найденное хранится в film_wiki.json)
          python3 playlists/wiki_plot.py /tmp/films_clean.m3u playlists/film_wiki.json || echo "::warning::Википедия недоступна — оставляю прежние описания"
          python3 playlists/categorize.py /tmp/films_clean.m3u /tmp/out/films.m3u playlists/film_genres.json playlists/film_wiki.json
          python3 playlists/clean_playlist.py /tmp/tv.m3u /tmp/out/tv.m3u

      # Шифруем для сервера New TV (открытые .m3u в репозиторий не попадают)
      - name: Зашифровать для сервера
        run: |
          pip install --quiet cryptography
          for n in films tv; do
            python3 playlists/encrypt.py /tmp/out/$n.m3u playlists/$n.enc || echo "::warning::$n: сервер не отдал ключ — оставляю прежний файл"
          done

      - name: Сохранить, если изменились
        run: |
          git config user.name "newtv-bot"
          git config user.email "newtv-bot@users.noreply.github.com"
          git add playlists/film_genres.json playlists/*.enc
          git add playlists/film_wiki.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Обновить плейлисты" && git pull --rebase && git push)
