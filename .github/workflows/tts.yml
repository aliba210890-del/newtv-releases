name: TTS
on:
  push:
    paths: ["tts/say.txt"]
permissions:
  contents: write
jobs:
  say:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: |
          python3 - <<'PY'
          import asyncio, edge_tts
          t=open("tts/say.txt",encoding="utf-8").read()
          async def m():
            for a in range(4):
              try:
                await edge_tts.Communicate(t,"ru-RU-SvetlanaNeural",rate="-5%").save("say.mp3"); return
              except Exception as e:
                print("retry",e); await asyncio.sleep(3)
          asyncio.run(m())
          PY
          ls -la say.mp3
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tts >/dev/null 2>&1 || gh release create tts --title tts --notes tts
          gh release upload tts say.mp3 --clobber
