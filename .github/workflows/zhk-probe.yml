# Разведка сайтов застройщиков для ЖК на карте «Жолда»
name: ZHK probe
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - run: python3 jolda-map/zhk_probe.py
      - run: gh release upload media zhk_probe.tgz -R ${{ github.repository }} --clobber
