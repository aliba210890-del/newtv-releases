services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld --max-table-size 200 /data/kz.osrm
    volumes: ["/opt/osrm/current:/data:ro"]
    ports: ["127.0.0.1:5000:5000"]
    restart: always
    mem_limit: 1500m
  caddy:
    image: caddy:2
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment: ["HOST=${HOST}", "KEY=${KEY}"]
    ports: ["80:80", "443:443"]
    volumes: ["caddy:/data", "/opt/osrm/Caddyfile:/etc/caddy/Caddyfile:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: always
volumes: { caddy: {} }
