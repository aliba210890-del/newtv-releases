[general]
static=yes

; входящий с GSM (from-goip) — генерирует sync.py в extensions_jolda.conf: звенит у всех диспетчеров на смене 40 сек
#include extensions_jolda.conf

; исходящий из Jolda («Перезвонить»): через свободную симку
[from-disp]
exten => _X.,1,Set(N=${EXTEN})
 same => n,ExecIf($["${N:0:1}" = "7"]?Set(N=8${N:1}))
 same => n,Dial(PJSIP/${N}@goip1,60)
 same => n,Dial(PJSIP/${N}@goip2,60)
 same => n,Dial(PJSIP/${N}@goip3,60)
 same => n,Dial(PJSIP/${N}@goip4,60)
 same => n,Dial(PJSIP/${N}@goip5,60)
 same => n,Dial(PJSIP/${N}@goip6,60)
 same => n,Dial(PJSIP/${N}@goip7,60)
 same => n,Dial(PJSIP/${N}@goip8,60)
 same => n,Hangup()

; автозвонок клиенту: клиент снял трубку — дважды проигрываем сообщение Jolda
[jolda-autocall]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(${JFILE})
 same => n,Wait(1)
 same => n,Playback(${JFILE})
 same => n,Hangup()
