; АТС Jolda на сервере (Hoster.kz, рядом с сервером маршрутов). GoIP парка регистрируется сюда через интернет,
; диспетчеры — из браузера (wss://sip.joldataxi.kz/ws → Caddy → ws://127.0.0.1:8088/ws).
; Линии и пароли приходят из Jolda (sync.py пишет pjsip_jolda.conf), здесь только общие настройки.
[global]
type=global
user_agent=Jolda

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=__PUBLIC_IP__
external_signaling_address=__PUBLIC_IP__

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[goip](!)
type=endpoint
context=from-goip
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
transport=transport-udp
[goip-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[disp](!)
type=endpoint
context=from-disp
disallow=all
allow=opus,alaw,ulaw
webrtc=yes
dtls_auto_generate_cert=yes
transport=transport-ws
[disp-aor](!)
type=aor
max_contacts=3
remove_existing=yes

#include pjsip_jolda.conf
